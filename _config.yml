title: "Linux Help Docs"
description: "Сборник инструкций и шпаргалок по Linux"
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme

color_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

nav_sort: case_sensitive
heading_anchors: true

aux_links:
  "GitHub":
    - "https://github.com/r00t-man/linux-help"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Наверх"

footer_content: "Сборник инструкций и шпаргалок по Linux — Astra Linux, РЕД ОС и другие дистрибутивы."

last_edit_timestamp: true
last_edit_time_format: "%d.%m.%Y в %H:%M"
